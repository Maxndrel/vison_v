<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Settings | Vision V</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />
      <link rel="stylesheet" href="./style/index.css" />

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
    }

    .sidebar {
      height: 100vh;
      background-color: #001f3f;
      padding-top: 20px;
      position: fixed;
      width: 220px;
      color: #fff;
    }

    .sidebar .nav-link {
      color: #ccc;
      margin-bottom: 10px;
    }

    .sidebar .nav-link.active,
    .sidebar .nav-link:hover {
      color: #fff;
      background-color: #004080;
      border-radius: 5px;
    }

    .main {
      margin-left: 240px;
      padding: 20px;
    }

    .nav-header {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2rem;
      text-align: center;
    }

    .section-title {
      font-weight: 600;
      margin-bottom: 25px;
      color: #001f3f;
    }

    .form-control,
    .form-check-input {
      box-shadow: none !important;
    }

    .card {
      border: none;
      margin-bottom: 30px;
      box-shadow: 0 0 10px rgba(0,0,0,0.05);
    }

    .btn-primary {
      background-color: #001f3f;
      border-color: #001f3f;
    }

    .btn-primary:hover {
      background-color: #004080;
    }

    @media (max-width: 768px) {
      .sidebar {
        display: none;
      }
      .main {
        margin-left: 0;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="text-center mb-4">
      <h4>Vision V</h4>
    </div>
    <a href="home.html" class="active"><i class="fa fa-home me-2"></i>Dashboard</a>
    <a href="swaps.html"><i class="fa fa-refresh me-2"></i>My Swaps</a>
    <a href="upload.html"><i class="fa fa-upload me-2"></i>Upload Device</a>
    <a href="notification.html"><i class="fa fa-bell me-2"></i>Notifications</a>
    <a href="settings.html"><i class="fa fa-cog me-2"></i>Settings</a>
    <a href="index.html"><i class="fa fa-sign-out me-2"></i>Logout</a>
  </nav>

  <!-- Main Content -->
  <div class="main">
    <h3 class="section-title">Account Settings</h3>

    <!-- Profile Info -->
    <div class="card p-4">
      <h5 class="mb-3"><i class="fa fa-user-circle"></i> Profile Information</h5>
      <form>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="fullName" class="form-label">Full Name</label>
            <input type="text" id="fullName" class="form-control" placeholder="John Doe" />
          </div>
          <div class="col-md-6">
            <label for="email" class="form-label">Email Address</label>
            <input type="email" id="email" class="form-control" placeholder="john@example.com" />
          </div>
          <div class="col-md-6">
            <label for="phone" class="form-label">Phone Number</label>
            <input type="text" id="phone" class="form-control" placeholder="+234..." />
          </div>
          <div class="col-md-6">
            <label for="location" class="form-label">Location</label>
            <input type="text" id="location" class="form-control" placeholder="Lagos, Nigeria" />
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Update Profile</button>
      </form>
    </div>

    <!-- Change Password -->
    <div class="card p-4">
      <h5 class="mb-3"><i class="fa fa-lock"></i> Change Password</h5>
      <form>
        <div class="row g-3">
          <div class="col-md-6">
            <label for="currentPassword" class="form-label">Current Password</label>
            <input type="password" id="currentPassword" class="form-control" />
          </div>
          <div class="col-md-6">
            <label for="newPassword" class="form-label">New Password</label>
            <input type="password" id="newPassword" class="form-control" />
          </div>
          <div class="col-md-6">
            <label for="confirmPassword" class="form-label">Confirm New Password</label>
            <input type="password" id="confirmPassword" class="form-control" />
          </div>
        </div>
        <button type="submit" class="btn btn-primary mt-3">Change Password</button>
      </form>
    </div>

    <!-- Notification Settings -->
    <div class="card p-4">
      <h5 class="mb-3"><i class="fa fa-bell"></i> Notification Preferences</h5>
      <form>
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" id="emailNotif" checked />
          <label class="form-check-label" for="emailNotif">Email Notifications</label>
        </div>
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" id="swapNotif" />
          <label class="form-check-label" for="swapNotif">Swap Request Alerts</label>
        </div>
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" id="promoNotif" checked />
          <label class="form-check-label" for="promoNotif">Promotional Updates</label>
        </div>
        <button type="submit" class="btn btn-primary mt-2">Save Preferences</button>
      </form>
    </div>

  </div>

</body>
</html>
