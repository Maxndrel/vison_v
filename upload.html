<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Uploaded Devices | Vision V</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css" />
      <link rel="stylesheet" href="./style/index.css" />

  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      background-color: #f8f9fa;
    }

    .sidebar {
      height: 100vh;
      background-color: #001f3f;
      padding-top: 20px;
      position: fixed;
      width: 220px;
      color: #fff;
    }

    .sidebar .nav-link {
      color: #ccc;
      margin-bottom: 10px;
    }

    .sidebar .nav-link.active,
    .sidebar .nav-link:hover {
      color: #fff;
      background-color: #004080;
      border-radius: 5px;
    }

    .main {
      margin-left: 240px;
      padding: 20px;
    }

    .card-box {
      border-radius: 8px;
      box-shadow: 0 0.5rem 1rem rgba(0,0,0,0.05);
      transition: 0.3s;
    }

    .card-box:hover {
      transform: translateY(-3px);
    }

    .section-title {
      font-weight: 600;
      margin-bottom: 30px;
      color: #001f3f;
    }

    .device-image {
      width: 100%;
      height: 150px;
      object-fit: cover;
      border-radius: 6px;
    }

    .btn-sm {
      font-size: 0.8rem;
    }

    .nav-header {
      font-size: 1.2rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2rem;
      text-align: center;
    }

    .device-status {
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <nav class="sidebar">
    <div class="text-center mb-4">
      <h4>Vision V</h4>
    </div>
    <a href="home.html" class="active"><i class="fa fa-home me-2"></i>Dashboard</a>
    <a href="swaps.html"><i class="fa fa-refresh me-2"></i>My Swaps</a>
    <a href="upload.html"><i class="fa fa-upload me-2"></i>Upload Device</a>
    <a href="notification.html"><i class="fa fa-bell me-2"></i>Notifications</a>
    <a href="settings.html"><i class="fa fa-cog me-2"></i>Settings</a>
    <a href="index.html"><i class="fa fa-sign-out me-2"></i>Logout</a>
  </nav>

  <!-- Main Content -->
  <div class="main">
    <h2 class="section-title">Uploaded Devices</h2>

    <div class="row g-4">
      <!-- Device 1 -->
      <div class="col-md-4">
        <div class="card card-box p-3">
          <img src="https://via.placeholder.com/300x150" class="device-image mb-3" alt="iPhone X">
          <h6>iPhone X - 64GB</h6>
          <p class="text-muted mb-1">Uploaded: July 25, 2025</p>
          <span class="badge bg-info device-status">Available</span>
          <div class="mt-3 d-flex justify-content-between">
            <button class="btn btn-outline-secondary btn-sm"><i class="fa fa-eye"></i> View</button>
            <button class="btn btn-outline-primary btn-sm"><i class="fa fa-pencil"></i> Edit</button>
            <button class="btn btn-outline-danger btn-sm"><i class="fa fa-trash"></i> Delete</button>
          </div>
        </div>
      </div>

      <!-- Device 2 -->
      <div class="col-md-4">
        <div class="card card-box p-3">
          <img src="https://via.placeholder.com/300x150" class="device-image mb-3" alt="Samsung A32">
          <h6>Samsung A32 - 128GB</h6>
          <p class="text-muted mb-1">Uploaded: July 18, 2025</p>
          <span class="badge bg-success device-status">Swapped</span>
          <div class="mt-3 d-flex justify-content-between">
            <button class="btn btn-outline-secondary btn-sm"><i class="fa fa-eye"></i> View</button>
            <button class="btn btn-outline-primary btn-sm"><i class="fa fa-pencil"></i> Edit</button>
            <button class="btn btn-outline-danger btn-sm"><i class="fa fa-trash"></i> Delete</button>
          </div>
        </div>
      </div>

      <!-- Device 3 -->
      <div class="col-md-4">
        <div class="card card-box p-3">
          <img src="https://via.placeholder.com/300x150" class="device-image mb-3" alt="HP Pavilion">
          <h6>HP Pavilion Laptop</h6>
          <p class="text-muted mb-1">Uploaded: July 10, 2025</p>
          <span class="badge bg-warning text-dark device-status">Pending</span>
          <div class="mt-3 d-flex justify-content-between">
            <button class="btn btn-outline-secondary btn-sm"><i class="fa fa-eye"></i> View</button>
            <button class="btn btn-outline-primary btn-sm"><i class="fa fa-pencil"></i> Edit</button>
            <button class="btn btn-outline-danger btn-sm"><i class="fa fa-trash"></i> Delete</button>
          </div>
        </div>
      </div>
    </div>
  </div>

</body>
</html>
