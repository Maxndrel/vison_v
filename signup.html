<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign Up | Vision V</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <style>
      body {
        background: linear-gradient(135deg, #f4f6f9 0%, #e9ecef 100%);
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      .signup-container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem 1rem;
      }
      .card {
        border: none;
        border-radius: 1.5rem;
        box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.15);
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.95);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, 0.2);
      }
      .form-control {
        border-radius: 0.75rem;
        border: 2px solid #e9ecef;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }
      .form-control:focus {
        border-color: #001f3f;
        box-shadow: 0 0 0 0.2rem rgba(0, 31, 63, 0.25);
      }
      .input-group-text {
        background: #f8f9fa;
        border: 2px solid #e9ecef;
        border-right: none;
        color: #6c757d;
      }
      .form-control:focus + .input-group-text,
      .input-group .form-control:focus ~ .input-group-text {
        border-color: #001f3f;
      }
      .btn-navy {
        background-color: #001f3f;
        color: #fff;
        border: none;
        border-radius: 0.75rem;
        padding: 0.875rem 2rem;
        font-weight: 600;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }
      .btn-navy::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s ease;
      }
      .btn-navy:hover {
        background-color: #003366;
        transform: translateY(-1px);
        box-shadow: 0 0.5rem 1rem rgba(0, 31, 63, 0.3);
      }
      .btn-navy:hover::before {
        left: 100%;
      }
      .btn-navy:active {
        transform: translateY(0);
      }
      .form-check-input:checked {
        background-color: #001f3f;
        border-color: #001f3f;
      }
      .text-decoration-none:hover {
        text-decoration: underline !important;
      }
      .alert {
        border-radius: 0.75rem;
        border: none;
        font-weight: 500;
      }
      .error-message {
        font-size: 0.875rem;
        margin-top: 0.25rem;
      }
    </style>
  </head>
  <body>
    <div class="signup-container">
      <div class="card p-4 p-md-5" style="max-width: 500px; width: 100%">
        <h3 class="text-center mb-4 fw-bold">Create an Account</h3>

        <form id="signup-form" action="home.html" novalidate>
          <div class="mb-3">
            <label for="name" class="form-label">Full Name</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa fa-user"></i></span>
              <input
                type="text"
                class="form-control"
                id="name"
                name="name"
                placeholder="John Doe"
                aria-describedby="name-error"
                required
              />
            </div>
            <div
              id="name-error"
              class="error-message text-danger"
              style="display: none"
            ></div>
          </div>

          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <div class="input-group">
              <span class="input-group-text"
                ><i class="fa fa-envelope"></i
              ></span>
              <input
                type="email"
                class="form-control"
                id="email"
                name="email"
                placeholder="you@example.com"
                aria-describedby="email-error"
                required
              />
            </div>
            <div
              id="email-error"
              class="error-message text-danger"
              style="display: none"
            ></div>
          </div>

          <div class="mb-3">
            <label for="phone" class="form-label">Phone Number</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa fa-phone"></i></span>
              <input
                type="tel"
                class="form-control"
                id="phone"
                name="phone"
                placeholder="+234..."
                aria-describedby="phone-error"
                required
              />
            </div>
            <div
              id="phone-error"
              class="error-message text-danger"
              style="display: none"
            ></div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa fa-lock"></i></span>
              <input
                type="password"
                class="form-control"
                id="password"
                name="password"
                placeholder="Create password"
                aria-describedby="password-error"
                required
              />
            </div>
            <div
              id="password-error"
              class="error-message text-danger"
              style="display: none"
            ></div>
          </div>

          <div class="mb-3">
            <label for="confirmPassword" class="form-label"
              >Confirm Password</label
            >
            <div class="input-group">
              <span class="input-group-text"><i class="fa fa-check"></i></span>
              <input
                type="password"
                class="form-control"
                id="confirmPassword"
                name="confirmPassword"
                placeholder="Re-enter password"
                aria-describedby="confirmPassword-error"
                required
              />
            </div>
            <div
              id="confirmPassword-error"
              class="error-message text-danger"
              style="display: none"
            ></div>
          </div>

          <div class="form-check mb-3">
            <input
              class="form-check-input"
              type="checkbox"
              id="terms"
              required
            />
            <label class="form-check-label" for="terms">
              I agree to the <a href="#">Terms & Conditions</a>
            </label>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-navy" id="signup-submit">
              Sign Up
            </button>
          </div>
        </form>

        <p class="mt-4 mb-0 text-center">
          Already have an account?
          <a href="login.html" class="text-decoration-none">Login</a>
        </p>
      </div>
    </div>
    <script src="./js/validation.js"></script>
    <script src="./js/auth.js"></script>
    <script>
      // Signup form validation and submission using localStorage
      document
        .getElementById("signup-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          clearErrors(this);

          const name = document.getElementById("name").value.trim();
          const email = document.getElementById("email").value.trim();
          const phone = document.getElementById("phone").value.trim();
          const password = document.getElementById("password").value.trim();
          const confirmPassword = document
            .getElementById("confirmPassword")
            .value.trim();
          const terms = document.getElementById("terms").checked;

          let isValid = true;

          if (name.length < 2) {
            showError("name", "Full name must be at least 2 characters.");
            isValid = false;
          }

          if (!validateEmail(email)) {
            showError("email", "Please enter a valid email address.");
            isValid = false;
          }

          if (!validatePhone(phone)) {
            showError(
              "phone",
              "Please enter a valid Nigerian phone number (e.g., +2348012345678)."
            );
            isValid = false;
          }

          if (!validatePassword(password)) {
            showError(
              "password",
              "Password must be at least 8 characters with uppercase, lowercase, and number."
            );
            isValid = false;
          }

          if (!passwordsMatch(password, confirmPassword)) {
            showError("confirmPassword", "Passwords do not match.");
            isValid = false;
          }

          if (!terms) {
            showError("terms", "You must agree to the Terms & Conditions.");
            isValid = false;
          }

          if (isValid) {
            try {
              const result = Auth.signup({ name, email, phone, password });
              showSuccess(result.message + " Redirecting to login...");
              // Redirect after successful signup
              setTimeout(() => {
                window.location.href = "login.html";
              }, 2000);
            } catch (error) {
              showGlobalError(error.message);
            }
          }
        });
    </script>
  </body>
</html>
