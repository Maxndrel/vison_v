<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Vision V</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <style>
      body {
        background: #f4f6f9;
        font-family: "Segoe UI", sans-serif;
      }
      .login-container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .card {
        border: none;
        border-radius: 1rem;
        box-shadow: 0 0.5rem 1rem rgba(0, 0, 0, 0.1);
      }
      .form-control {
        border-radius: 0.5rem;
      }
      .btn-navy {
        background-color: #001f3f;
        color: #fff;
      }
      .btn-navy:hover {
        background-color: #001735;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="card p-4 p-md-5" style="max-width: 400px; width: 100%">
        <h3 class="text-center mb-4 fw-bold">Vision V Login</h3>

        <form id="login-form" action="home.html" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <div class="input-group">
              <span class="input-group-text"
                ><i class="fa fa-envelope"></i
              ></span>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="you@example.com"
                aria-describedby="email-error"
                required
              />
            </div>
            <div
              id="email-error"
              class="error-message text-danger"
              style="display: none"
            ></div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa fa-lock"></i></span>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Enter password"
                aria-describedby="password-error"
                required
              />
            </div>
            <div
              id="password-error"
              class="error-message text-danger"
              style="display: none"
            ></div>
          </div>

          <div class="d-flex justify-content-between mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" />
              <label class="form-check-label" for="remember">Remember me</label>
            </div>
            <a href="#" class="text-decoration-none">Forgot password?</a>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-navy" id="login-submit">
              Login
            </button>
          </div>
        </form>

        <p class="mt-4 mb-0 text-center">
          Don't have an account?
          <a href="signup.html" class="text-decoration-none">Sign up</a>
        </p>
      </div>
    </div>
    <script src="./js/validation.js"></script>
    <script src="./js/auth.js"></script>
    <script>
      // Login form validation and submission using localStorage
      document
        .getElementById("login-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          clearErrors(this);

          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value.trim();

          let isValid = true;

          if (!validateEmail(email)) {
            showError("email", "Please enter a valid email address.");
            isValid = false;
          }

          if (password.length < 1) {
            showError("password", "Password is required.");
            isValid = false;
          }

          if (isValid) {
            try {
              const result = Auth.login(email, password);
              showSuccess(result.message + " Redirecting...");
              // Redirect after successful login
              setTimeout(() => {
                window.location.href = "home.html";
              }, 2000);
            } catch (error) {
              showGlobalError(error.message);
            }
          }
        });
    </script>
  </body>
</html>
