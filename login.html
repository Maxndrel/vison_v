<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Login | Vision V</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      rel="stylesheet"
      href="https://maxcdn.bootstrapcdn.com/font-awesome/4.7.0/css/font-awesome.min.css"
    />
    <style>
      body {
        background: linear-gradient(135deg, #f4f6f9 0%, #e9ecef 100%);
        font-family: "Segoe UI", sans-serif;
        margin: 0;
        padding: 0;
        min-height: 100vh;
      }
      .login-container {
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        padding: 2rem 1rem;
      }
      .card {
        border: none;
        border-radius: 1.5rem;
        box-shadow: 0 1rem 2rem rgba(0, 0, 0, 0.15);
        backdrop-filter: blur(10px);
        background: rgba(255, 255, 255, 0.95);
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }
      .card:hover {
        transform: translateY(-2px);
        box-shadow: 0 1.5rem 3rem rgba(0, 0, 0, 0.2);
      }
      .form-control {
        border-radius: 0.75rem;
        border: 2px solid #e9ecef;
        padding: 0.75rem 1rem;
        font-size: 1rem;
        transition: border-color 0.3s ease, box-shadow 0.3s ease;
      }
      .form-control:focus {
        border-color: #001f3f;
        box-shadow: 0 0 0 0.2rem rgba(0, 31, 63, 0.25);
      }
      .input-group-text {
        background: #f8f9fa;
        border: 2px solid #e9ecef;
        border-right: none;
        color: #6c757d;
      }
      .form-control:focus + .input-group-text,
      .input-group .form-control:focus ~ .input-group-text {
        border-color: #001f3f;
      }
      .btn-navy {
        background-color: #001f3f;
        color: #fff;
        border: none;
        border-radius: 0.75rem;
        padding: 0.875rem 2rem;
        font-weight: 600;
        font-size: 1.1rem;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
      }
      .btn-navy::before {
        content: "";
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(
          90deg,
          transparent,
          rgba(255, 255, 255, 0.2),
          transparent
        );
        transition: left 0.5s ease;
      }
      .btn-navy:hover {
        background-color: #003366;
        transform: translateY(-1px);
        box-shadow: 0 0.5rem 1rem rgba(0, 31, 63, 0.3);
      }
      .btn-navy:hover::before {
        left: 100%;
      }
      .btn-navy:active {
        transform: translateY(0);
      }
      .form-check-input:checked {
        background-color: #001f3f;
        border-color: #001f3f;
      }
      .text-decoration-none:hover {
        text-decoration: underline !important;
      }
      .alert {
        border-radius: 0.75rem;
        border: none;
        font-weight: 500;
      }
      .error-message {
        font-size: 0.875rem;
        margin-top: 0.25rem;
      }
    </style>
  </head>
  <body>
    <div class="login-container">
      <div class="card p-4 p-md-5" style="max-width: 400px; width: 100%">
        <h3 class="text-center mb-4 fw-bold">Vision V Login</h3>

        <form id="login-form" action="home.html" novalidate>
          <div class="mb-3">
            <label for="email" class="form-label">Email address</label>
            <div class="input-group">
              <span class="input-group-text"
                ><i class="fa fa-envelope"></i
              ></span>
              <input
                type="email"
                class="form-control"
                id="email"
                placeholder="you@example.com"
                aria-describedby="email-error"
                required
              />
            </div>
            <div
              id="email-error"
              class="error-message text-danger"
              style="display: none"
            ></div>
          </div>

          <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <div class="input-group">
              <span class="input-group-text"><i class="fa fa-lock"></i></span>
              <input
                type="password"
                class="form-control"
                id="password"
                placeholder="Enter password"
                aria-describedby="password-error"
                required
              />
            </div>
            <div
              id="password-error"
              class="error-message text-danger"
              style="display: none"
            ></div>
          </div>

          <div class="d-flex justify-content-between mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" id="remember" />
              <label class="form-check-label" for="remember">Remember me</label>
            </div>
            <a href="#" class="text-decoration-none">Forgot password?</a>
          </div>

          <div class="d-grid">
            <button type="submit" class="btn btn-navy" id="login-submit">
              Login
            </button>
          </div>
        </form>

        <p class="mt-4 mb-0 text-center">
          Don't have an account?
          <a href="signup.html" class="text-decoration-none">Sign up</a>
        </p>
      </div>
    </div>
    <script src="./js/validation.js"></script>
    <script src="./js/auth.js"></script>
    <script>
      // Login form validation and submission using localStorage
      document
        .getElementById("login-form")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          clearErrors(this);

          const email = document.getElementById("email").value.trim();
          const password = document.getElementById("password").value.trim();

          let isValid = true;

          if (!validateEmail(email)) {
            showError("email", "Please enter a valid email address.");
            isValid = false;
          }

          if (password.length < 1) {
            showError("password", "Password is required.");
            isValid = false;
          }

          if (isValid) {
            try {
              const result = Auth.login(email, password);
              showSuccess(result.message + " Redirecting...");
              // Redirect after successful login
              setTimeout(() => {
                window.location.href = "home.html";
              }, 2000);
            } catch (error) {
              showGlobalError(error.message);
            }
          }
        });
    </script>
  </body>
</html>
